; Shake-to-mix firmware for Raspberry Pi Pico (RP2040), Arduino-Pico core.
;
; The "platform" line below is required for the Earle Philhower core
; (the one with full pico-sdk access). It downloads on first build.
[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower

; Run the RP2040 at 200 MHz so physics finishes well inside one display frame.
; (Safe on a stock Pico. Delete this line to run at the default 133 MHz.)
board_build.f_cpu = 200000000L

monitor_speed = 115200
build_unflags = -Os
build_flags =
    -O2
    -Wall
    -Wextra
    -Iinclude